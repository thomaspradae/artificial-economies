name: Deploy Explorer To GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "explorer/**"
      - "scripts/export_web_bundle.py"
      - ".github/workflows/pages.yml"
      - "outputs/mechanism_traces_local_full/**"
      - "outputs/pricing_quantity_margin_audit/**"
      - "outputs/phase3_full/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Export static scenario bundle
        run: python scripts/export_web_bundle.py
      - name: Install frontend dependencies
        working-directory: explorer
        run: npm ci
      - name: Build frontend
        working-directory: explorer
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: explorer/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
